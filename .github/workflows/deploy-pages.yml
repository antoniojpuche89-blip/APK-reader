.app-main{min-width:0;width:100%;max-width:1740px;margin:0 auto;padding:18px clamp(16px,2vw,32px) 28px}.app-header{margin-bottom:16px;padding-bottom:14px}.header-heading h1{font-size:clamp(22px,2vw,29px)}.header-stat{padding:8px 13px;background:linear-gradient(120deg,rgba(50,43,100,.8),rgba(22,35,70,.9));border-color:var(--d-line)}
