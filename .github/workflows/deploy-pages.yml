name: Deploy Lector beta to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reassemble Lector beta archive
        run: |
          cat lector-beta1.part* > lector-beta1.zip
          echo '79e61d94b58027427e283a1829e87d3f3e674ab91c28bd1a2c90e42e93bafd0e  lector-beta1.zip' | sha256sum -c -
          unzip -tq lector-beta1.zip
      - name: Prepare Lector website
        run: |
          mkdir -p site
          unzip -q lector-beta1.zip -d site
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
