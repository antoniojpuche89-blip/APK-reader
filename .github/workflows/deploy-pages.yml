.app-sidebar{position:sticky;top:0;height:100vh;min-height:640px;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--d-line);padding:20px 14px 0;background:linear-gradient(180deg,#171438,#111630 56%,#0b1027);z-index:12}
.sidebar-brand{display:flex;align-items:center;flex-direction:column;text-align:center;padding-bottom:25px}.sidebar-logo{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 4px 15px rgba(147,75,255,.5))}.sidebar-wordmark{font-size:27px;font-weight:950;letter-spacing:2.4px;background:linear-gradient(90deg,#fff,#c49cff 55%,#77e6ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sidebar-tagline{font-size:9px;color:#d1c9ef}.sidebar-nav{display:flex;flex-direction:column;gap:8px}.sidebar-link{min-height:52px;border-radius:14px;font-size:13px}.sidebar-link.active{background:linear-gradient(110deg,#8736e9,#5729bf);box-shadow:0 7px 20px rgba(112,56,220,.34)}
