.dash-layout{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:16px;align-items:start}.dash-centre{min-width:0}.dash-aside{display:flex;flex-direction:column;gap:13px}
.dash-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 13px}.dash-search{height:41px;width:min(250px,27vw);display:flex;align-items:center;gap:8px;border:1px solid var(--d-line);border-radius:12px;padding:0 12px;background:linear-gradient(120deg,#202448,#171f3e);color:#d1b4ff}.dash-search>span{font-size:22px}.dash-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:11px}.dash-search input::placeholder{color:#9ba6c7}.dash-grid-button{width:36px;height:39px;border:1px solid var(--d-line);border-radius:10px;background:#1c2142;color:#d0b6ff}.dash-add{white-space:nowrap;padding:10px 13px;font-size:10px;border-radius:10px}.dash-catalog{border:0;background:transparent;color:#c4aaff;font-weight:800;font-size:10px}.dash-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.dash-filter{border:1px solid var(--d-line);border-radius:999px;padding:8px 17px;background:#191f3f;color:#e6e0f8;font-size:10px;font-weight:750}.dash-filter.active{background:linear-gradient(110deg,#963bf1,#612bd1);color:#fff}.dash-filter-hidden{display:none!important}
.book-list{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.book-card{padding:8px;border-radius:15px;background:linear-gradient(160deg,#202647,#141b35);border-color:rgba(159,141,255,.3)}.book-cover-mini{aspect-ratio:2/2.76;height:auto;position:relative;border-radius:8px;overflow:hidden}.book-cover-mini img{width:100%;height:100%;object-fit:cover}.dash-status{position:absolute;z-index:3;top:7px;right:6px;padding:5px 8px;border-radius:999px;background:#843ce5;color:#fff;font-size:8px;font-weight:850}.dash-status.done{background:#15845b}.dash-status.pending{background:#282a4d;color:#e6ddff}.book-detail{padding:9px 3px 4px}.book-detail h3{font:750 12px/1.2 Inter,system-ui,sans-serif;min-height:29px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.book-meta{font-size:8px;color:#aab4d0}.book-progress{height:5px}.open-book{font-size:8px;padding:7px 8px}
.featured-books-section{margin-top:20px}.featured-heading h2{font-size:18px}.featured-book-shelf{grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.featured-book-card{padding:8px;background:linear-gradient(160deg,#202647,#141b35);border-color:rgba(159,141,255,.28);border-radius:13px;display:flex;flex-direction:column}.featured-book-art{width:100%;height:auto;aspect-ratio:2/2.76;border-radius:8px}.featured-book-card strong{font:750 10px/1.2 Inter,system-ui,sans-serif;min-height:25px}.featured-book-card small{font-size:8px}
.dash-panel{padding:14px;border:1px solid var(--d-line);border-radius:16px;background:linear-gradient(150deg,rgba(38,34,89,.97),rgba(16,26,57,.98));box-shadow:0 9px 23px rgba(0,0,0,.17)}.dash-panel header{display:flex;align-items:center;gap:9px;margin-bottom:11px}.dash-panel header>span{font-size:23px;color:#d2aaff}.dash-panel h3{font-size:14px;font-weight:850;color:#fff;margin:0;flex:1}.dash-panel header button{border:0;background:transparent;color:#e3d8ff;font-size:23px}.dash-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dash-metrics>div{min-height:66px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;border:1px solid rgba(169,129,255,.5);border-radius:10px;background:rgba(102,48,185,.21)}.dash-metrics b{color:#d9aaff;font-size:21px}.dash-metrics small{font-size:8px;color:#eee7ff}.dash-metrics .review{border-color:rgba(246,190,85,.55);background:rgba(111,78,30,.2)}.dash-metrics .review b{color:#ffe18b}.dash-metrics .known{border-color:rgba(67,220,159,.5);background:rgba(20,107,80,.22)}.dash-metrics .known b{color:#69edb8}
.dash-copy{font-size:9px;line-height:1.4;color:#c3c8df;margin:-3px 2px 11px}.dash-flash{min-height:160px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:1px solid #d9caff;border-radius:15px;background:radial-gradient(circle at 50% 0%,#e2d7ff,#fffafd 76%);color:#17154a}.dash-flash-top{position:absolute;top:9px;left:11px;right:11px;display:flex;justify-content:space-between;color:#584a80;font-size:9px}.dash-flash-top button{border:0;background:transparent;color:#4830a4;font-size:18px}.dash-flash>strong{font-size:24px;text-align:center;color:#19164f;font-weight:900;margin:14px 0 7px}.dash-flash>div:not(.dash-flash-top){padding:6px 12px;border-radius:8px;background:#e8defe;color:#422b7d;font-size:13px;font-weight:800}.dash-flash>button{margin-top:9px;border:0;background:transparent;color:#7356b9;font-size:9px;font-weight:800}.dash-arrows{display:flex;justify-content:space-between;margin:7px 0}.dash-arrows button{width:28px;height:27px;border:1px solid rgba(190,150,255,.5);border-radius:50%;background:#4e2c9a;color:white;font-size:18px}.dash-start-game{width:100%;border:0;border-radius:999px;padding:9px 12px;background:linear-gradient(110deg,#a033f0,#632bd2);color:#fff;font-size:10px;font-weight:850}
.dash-week-title{display:flex;justify-content:space-between;font-size:9px;color:#c6c9df;margin-bottom:10px}.dash-week-title b{color:#67eeb5;font-size:13px}.dash-week{height:82px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:8px;padding:0 2px;border-bottom:1px solid var(--d-line);position:relative}.dash-week-bar-wrap{height:100%;display:flex;align-items:end;justify-content:center}.dash-week-bar{width:72%;min-width:9px;max-width:26px;border-radius:5px 5px 1px 1px;background:linear-gradient(180deg,#c168ff,#7137df)}.dash-week-bar.today{background:linear-gradient(180deg,#ffbe72,#db64ff)}.dash-chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:#9099b7;font-size:8px}.dash-week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px;text-align:center;color:#afb6d0;font-size:8px}.dash-goal{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--d-line);border-radius:13px;background:rgba(85,46,160,.25)}.dash-goal>span{font-size:27px;color:#e0caff}.dash-goal b,.dash-goal small{display:block}.dash-goal b{font-size:11px;color:#fff}.dash-goal small{font-size:9px;color:#b9c0dd;margin-top:3px}
@media(max-width:1320px){.dash-layout{grid-template-columns:minmax(0,1fr) 275px}.book-list{grid-template-columns:repeat(3,minmax(0,1fr))}.dash-catalog{display:none}}
@media(max-width:1080px){.dash-layout{grid-template-columns:1fr}.dash-aside{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.dash-panel:last-of-type{grid-column:auto}.dash-goal{grid-column:1/-1}}
@media(max-width:820px){.app-shell{display:block;min-height:100vh}.app-sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;min-height:0;padding:7px 9px max(7px,env(safe-area-inset-bottom));display:block;border:0;border-top:1px solid var(--d-line);background:rgba(17,20,46,.96);backdrop-filter:blur(18px)}.sidebar-brand,.sidebar-bottom{display:none}.sidebar-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.sidebar-link{min-height:47px;flex-direction:column;justify-content:center;gap:2px;padding:4px 2px;border-radius:9px;font-size:8px}.sidebar-link .nav-icon{width:auto;flex:auto;font-size:18px;line-height:1}.app-main{padding:15px 14px 96px}.dash-aside{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-week-panel{grid-column:1/-1}}
@media(max-width:560px){.app-main{padding:14px 11px 94px}.dash-search{flex:1;width:auto}.dash-filters{gap:5px}.dash-filter{padding:7px 11px;font-size:9px}.book-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.featured-book-shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-aside{grid-template-columns:1fr}.dash-panel:last-of-type,.dash-goal{grid-column:auto}}

