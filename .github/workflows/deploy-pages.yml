name: Deploy Lextory Beta 4 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reassemble and validate Beta 2 base
        run: |
          cat lector-beta2.part* > lector-beta2.zip
          echo '8b1d06d9a45bd01439fc299e677951abbff30548913621902cdd1c791773e867  lector-beta2.zip' | sha256sum -c -
          unzip -tq lector-beta2.zip
      - name: Prepare Lextory Beta 4 visual interface
        run: |
          mkdir -p site
          unzip -q lector-beta2.zip -d site
          cp -a lextory-beta3-overlay/. site/
          cat lextory-beta4-payload/overlay.part* | base64 -d | tar -xz -C site
          test -s site/index.html
          test -s site/app.js
          test -s site/styles.css
          test -s site/icon-192.png
          test -s site/icon.svg
          grep -q 'flashcard-game' site/index.html
          grep -q 'extractEpubCover' site/app.js
          grep -q 'featured-book-shelf' site/styles.css
          node --check site/app.js
          node --check site/sw.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
