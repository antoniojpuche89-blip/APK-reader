name: Deploy Lextory Beta 6 redesigned reader and account foundation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reassemble and validate Beta 2 base
        run: |
          cat lector-beta2.part* > lector-beta2.zip
          echo '8b1d06d9a45bd01439fc299e677951abbff30548913621902cdd1c791773e867  lector-beta2.zip' | sha256sum -c -
          unzip -tq lector-beta2.zip
      - name: Prepare Lextory Beta 4
        run: |
          mkdir -p site
          unzip -q lector-beta2.zip -d site
          cp -a lextory-beta3-overlay/. site/
          cat lextory-beta4-payload/overlay.part* | base64 -d | tar -xz -C site
      - name: Apply Lextory Beta 5 dashboard, icon and multi-source catalogue
        run: |
          cp lextory-beta5/dashboard.css site/dashboard.css
          cp lextory-beta5/dashboard.js site/dashboard.js
          cp lextory-beta5/catalog-universal.js site/catalog-universal.js
          cp lextory-beta5/icon.svg site/icon.svg
          cp lextory-beta5/manifest.webmanifest site/manifest.webmanifest
          cp lextory-beta5/sw.js site/sw.js
          cp lextory-beta6/cloud-sync.js site/cloud-sync.js
          cp lextory-beta6/supabase-config.js site/supabase-config.js
          cp lextory-beta6/premium-ui.js site/premium-ui.js
          cp lextory-beta6/reader-enhancements.js site/reader-enhancements.js
          cp lextory-beta6/bobby-reading.webp site/bobby-reading.webp
          cp lextory-beta6/privacy.html site/privacy.html
          cp lextory-beta6/delete-account.html site/delete-account.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          if 'dashboard.css' not in s:
              s = s.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="dashboard.css">')
          if 'catalog-universal.js' not in s:
              s = s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n  <script src="catalog-universal.js"></script>\n  <script src="dashboard.js"></script>')
          s = s.replace('<span>Project Gutenberg · Google Books</span>', '<span>Project Gutenberg</span>')
          s = s.replace('<span>Project Gutenberg</span>', '<span>Project Gutenberg</span>')
          s = s.replace('Clásicos para descubrir y añadir a tu biblioteca.', 'Busca en Project Gutenberg.')
          s = s.replace('Libros gratuitos</h2>', 'Catálogo de libros</h2>')
          s = s.replace('Clásicos en distintos idiomas con portadas reales, cuando el catálogo las proporciona.', 'Busca por título, autor o categoría en Project Gutenberg. Descarga los EPUB compatibles directamente en Mi Biblioteca.')
          s = s.replace('Libros gratuitos</h2>', 'Explorar libros</h2>')
          s = s.replace('si el navegador bloquea la importación automática, se abre la descarga para que puedas importarla manualmente.', 'los EPUB compatibles se guardan directamente en Mi Biblioteca.')
          s = s.replace('Buscar título o autor…', 'Buscar en Project Gutenberg: título o autor…')
          s = s.replace('Project Gutenberg y encuentra tu próxima lectura.', 'Project Gutenberg y encuentra tu próxima lectura.')
          extras = '''\n  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>\n  <script src="supabase-config.js"></script>\n  <script src="cloud-sync.js"></script>\n  <script src="premium-ui.js"></script>\n  <script src="reader-enhancements.js"></script>'''
          if 'cloud-sync.js' not in s:
              s = s.replace('<script src="dashboard.js"></script>', '<script src="dashboard.js"></script>' + extras)
          p.write_text(s)
          app = Path('site/app.js')
          app_js = app.read_text()
          stamp = "    localStorage.setItem(VOCABULARY_KEY, JSON.stringify(state.vocabulary));"
          if "lector-vocabulary-updated-at" not in app_js:
              if stamp not in app_js:
                  raise SystemExit("Could not locate vocabulary persistence hook")
              app_js = app_js.replace(stamp, stamp + chr(10) + "    localStorage.setItem('lector-vocabulary-updated-at', String(Date.now()));", 1)
          event_hook = "  window.addEventListener('lextory:cloud-vocabulary-restored', () => {" + chr(10) + "    loadVocabulary();" + chr(10) + "    renderVocabulary();" + chr(10) + "  });" + chr(10) + chr(10)
          if "lextory:cloud-vocabulary-restored" not in app_js:
              anchor = "  async function init() {"
              if anchor not in app_js:
                  raise SystemExit("Could not locate application init hook")
              app_js = app_js.replace(anchor, event_hook + anchor, 1)
          location_hook = "    state.epubRendition.on('relocated', location => {" + chr(10) + "      if (!location || !location.start) return;"
          if "state.epubCurrentLocation = location;" not in app_js:
              if location_hook not in app_js:
                  raise SystemExit("Could not locate EPUB location hook")
              app_js = app_js.replace(location_hook, location_hook + chr(10) + "      state.epubCurrentLocation = location;", 1)
          clear_location_anchor = "    state.epubBook = null; state.epubRendition = null; state.pdfDoc = null;"
          if "state.epubCurrentLocation = null;" not in app_js:
              if clear_location_anchor not in app_js:
                  raise SystemExit("Could not locate reader reset hook")
              app_js = app_js.replace(clear_location_anchor, clear_location_anchor + chr(10) + "    state.epubCurrentLocation = null;", 1)
          page_api = r"""  const getCurrentPageTextBase = getCurrentPageText;
            getCurrentPageText = function() {
              if (state.currentBook?.format === 'pdf') return state.pdfPageText || '';
              if (state.epubRendition) {
                try {
                  const location = state.epubCurrentLocation || state.epubRendition.currentLocation();
                  if (location?.start?.cfi && location?.end?.cfi) {
                    const start = state.epubRendition.getRange(location.start.cfi);
                    const end = state.epubRendition.getRange(location.end.cfi);
                    const doc = start?.startContainer?.ownerDocument;
                    if (doc && end?.startContainer?.ownerDocument === doc) {
                      const range = doc.createRange();
                      range.setStart(start.startContainer, start.startOffset);
                      range.setEnd(end.startContainer, end.startOffset);
                      const visibleText = range.toString().replace(/\s+/g, ' ').trim();
                      if (visibleText) return visibleText;
                    }
                  }
                } catch (error) {
                  console.warn('No se pudo extraer la página EPUB visible:', error);
                }
                return '';
              }
              return getCurrentPageTextBase();
            };
            window.LEXTORY_READER = window.LEXTORY_READER || {};
            window.LEXTORY_READER.getCurrentPageText = getCurrentPageText;
          """
          if "window.LEXTORY_READER.getCurrentPageText" not in app_js:
              anchor = "  function safeExternalUrl(value) {"
              if anchor not in app_js:
                  raise SystemExit("Could not locate current-page text API hook")
              app_js = app_js.replace(anchor, page_api + anchor, 1)
          import_start = "  async function importBook(file, metadata = {}) {"
          import_end = "\n  function destroyCurrentReader() {"
          if import_start not in app_js or import_end not in app_js:
              raise SystemExit("Could not locate native book import function")
          if "window.LEXTORY_BOOKS.waitForDatabase" not in app_js:
              start = app_js.index(import_start)
              end = app_js.index(import_end, start)
              new_import = r"""  async function importBook(file, metadata = {}, options = {}) {
              if (!file) return null;
              const ext = String(file.name || '').split('.').pop().toLowerCase();
              if (!['epub', 'pdf'].includes(ext)) { showToast('Elige un archivo EPUB o PDF.'); return null; }
              if (file.size > 180 * 1024 * 1024) { showToast('El archivo supera el límite recomendado de 180 MB.'); return null; }
          
              try {
                const normalise = value => String(value || '')
                  .replace(/\.(epub|pdf)$/i, '')
                  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                const existingBooks = await getAllBooks();
                const duplicate = existingBooks.find(book => {
                  if (!book.blob || !Number(book.blob.size || 0)) return false;
                  if (metadata.sourceKey && metadata.sourceId != null &&
            book.sourceKey === metadata.sourceKey &&
            String(book.sourceId || '') === String(metadata.sourceId)) return true;
                  return metadata.allowTitleMatch !== false &&
          (normalise(book.title) === normalise(metadata.title || safeBookTitle(file.name)) || normalise(book.fileName) === normalise(file.name));
                });
                if (duplicate) {
                  await refreshLibrary();
                  if (options.openReader === true) openBook(duplicate.id);
                  return duplicate;
                }
          
                const id = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(16).slice(2));
                showToast('Guardando libro en tu biblioteca…');
                let coverDataUrl = metadata.coverDataUrl || null;
                if (!coverDataUrl) {
                  try { coverDataUrl = await extractBookCover(file, ext); }
                  catch (coverError) { console.info('El libro se guardará sin portada:', coverError); }
                }
          
                const book = {
                  id: id,
                  title: metadata.title || safeBookTitle(file.name),
                  fileName: file.name,
                  format: ext,
                  blob: file,
                  coverDataUrl: coverDataUrl || null,
                  addedAt: Date.now(),
                  updatedAt: Date.now(),
                  progress: 0,
                  lastPage: 1,
                  lastCfi: null,
                  totalPages: null,
                  sourceKey: metadata.sourceKey || null,
                  sourceId: metadata.sourceId == null ? null : String(metadata.sourceId)
                };
          
                await putBook(book);
                await refreshLibrary();
                if ($('file-input')) $('file-input').value = '';
                showToast('Libro añadido a tu biblioteca.');
                window.dispatchEvent(new CustomEvent('lextory:library-updated', {
                  detail: { bookId: id, title: book.title }
                }));
                if (options.openReader !== false) openBook(id);
                return book;
              } catch (error) {
                console.error('No se pudo guardar el libro:', error);
                showToast('No se pudo guardar el libro. Comprueba el espacio disponible.');
                return null;
              }
            }
          
            async function waitForLibraryDatabase(timeoutMs = 20000) {
              const started = Date.now();
              while (!state.db) {
                if (Date.now() - started >= timeoutMs) {
                  throw new Error('La biblioteca local todavía no está lista. Recarga Lextory e inténtalo de nuevo.');
                }
                await new Promise(resolve => setTimeout(resolve, 50));
              }
              return state.db;
            }

            window.LEXTORY_BOOKS = window.LEXTORY_BOOKS || {};
            window.LEXTORY_BOOKS.waitForDatabase = waitForLibraryDatabase;
            window.LEXTORY_BOOKS.importFile = async (file, metadata = {}, options = {}) => {
              await waitForLibraryDatabase();
              return importBook(file, metadata, options);
            };
            window.LEXTORY_BOOKS.getAll = async () => {
              await waitForLibraryDatabase();
              return getAllBooks();
            };
            window.LEXTORY_BOOKS.refresh = async () => {
              await waitForLibraryDatabase();
              return refreshLibrary();
            };
          """
              app_js = app_js[:start] + new_import + app_js[end:]
          delete_anchor = "        await deleteBookRecord(book.id); await refreshLibrary(); showToast('Libro eliminado de tu biblioteca.');"
          if delete_anchor in app_js and "detail: { deletedBookId: book.id }" not in app_js:
              app_js = app_js.replace(
                  delete_anchor,
                  "        await deleteBookRecord(book.id); await refreshLibrary(); window.dispatchEvent(new CustomEvent('lextory:library-updated', { detail: { deletedBookId: book.id } })); showToast('Libro eliminado de tu biblioteca.');",
                  1
              )
          app.write_text(app_js)
          PY
          test -s site/bobby-reading.webp
          grep -q 'bobby-reading.webp' site/dashboard.js
          grep -q 'bobby-reading.webp' site/sw.js
          grep -q 'dashboard.css' site/index.html
          grep -q 'dashboard.js' site/index.html
          grep -q 'catalog-universal.js' site/index.html
          grep -q 'cloud-sync.js' site/index.html
          grep -q 'privacy.html' site/cloud-sync.js
          grep -q 'delete-account.html' site/cloud-sync.js
          grep -q 'lector-vocabulary-updated-at' site/app.js
          grep -q 'window.LEXTORY_READER.getCurrentPageText' site/app.js
          grep -q 'window.LEXTORY_BOOKS.importFile' site/app.js
          grep -q 'lextory-shell-v26' site/sw.js
          grep -q 'unpkg.com/@supabase/supabase-js@2' site/index.html
          grep -q 'Project Gutenberg' site/catalog-universal.js
          if grep -qi 'openlibrary\|open library\|google books\|googleapis.com/books\|importGoogle' site/catalog-universal.js; then echo 'A removed catalogue source is still present'; exit 1; fi
          grep -q 'https://ww3.ebookelo.com/' site/catalog-universal.js
          grep -q 'https://ww3.lectulandia.com/' site/catalog-universal.js
          grep -q 'catalog-import-external' site/catalog-universal.js
          node --check site/app.js
          node --check site/catalog-universal.js
          node --check site/dashboard.js
          node --check site/cloud-sync.js
          node --check site/supabase-config.js
          node --check site/premium-ui.js
          node --check site/reader-enhancements.js
          node --check site/sw.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
