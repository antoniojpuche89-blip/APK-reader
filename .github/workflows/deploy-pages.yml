name: Deploy Lextory Beta 5.3 Gutenberg and Google Books catalogue to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reassemble and validate Beta 2 base
        run: |
          cat lector-beta2.part* > lector-beta2.zip
          echo '8b1d06d9a45bd01439fc299e677951abbff30548913621902cdd1c791773e867  lector-beta2.zip' | sha256sum -c -
          unzip -tq lector-beta2.zip
      - name: Prepare Lextory Beta 4
        run: |
          mkdir -p site
          unzip -q lector-beta2.zip -d site
          cp -a lextory-beta3-overlay/. site/
          cat lextory-beta4-payload/overlay.part* | base64 -d | tar -xz -C site
      - name: Apply Lextory Beta 5 dashboard, icon and multi-source catalogue
        run: |
          cp lextory-beta5/dashboard.css site/dashboard.css
          cp lextory-beta5/dashboard.js site/dashboard.js
          cp lextory-beta5/catalog-universal.js site/catalog-universal.js
          cp lextory-beta5/icon.svg site/icon.svg
          cp lextory-beta5/manifest.webmanifest site/manifest.webmanifest
          cp lextory-beta5/sw.js site/sw.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          if 'dashboard.css' not in s:
              s = s.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="dashboard.css">')
          if 'catalog-universal.js' not in s:
              s = s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n  <script src="catalog-universal.js"></script>\n  <script src="dashboard.js"></script>')
          s = s.replace('<span>Project Gutenberg</span>', '<span>Project Gutenberg · Google Books</span>')
          s = s.replace('Clásicos para descubrir y añadir a tu biblioteca.', 'Busca en Project Gutenberg y Google Books.')
          s = s.replace('Libros gratuitos</h2>', 'Catálogo de libros</h2>')
          s = s.replace('Clásicos en distintos idiomas con portadas reales, cuando el catálogo las proporciona.', 'Busca por título o autor en dos catálogos. Añade directamente los EPUB que estén disponibles como descarga de dominio público.')
          s = s.replace('Buscar título o autor…', 'Buscar en 2 catálogos: título o autor…')
          s = s.replace('Project Gutenberg y encuentra tu próxima lectura.', 'Project Gutenberg y Google Books, y encuentra tu próxima lectura.')
          p.write_text(s)
          PY
          grep -q 'dashboard.css' site/index.html
          grep -q 'dashboard.js' site/index.html
          grep -q 'catalog-universal.js' site/index.html
          grep -q 'Google Books' site/catalog-universal.js
          if grep -qi 'openlibrary\|open library' site/catalog-universal.js; then echo 'Open Library still present'; exit 1; fi
          grep -q 'importGoogle' site/catalog-universal.js
          grep -q "lextory-shell-v10" site/sw.js
          node --check site/app.js
          node --check site/catalog-universal.js
          node --check site/dashboard.js
          node --check site/sw.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
