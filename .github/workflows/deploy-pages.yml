name: Deploy Lextory Beta 6 redesigned reader and account foundation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Reassemble and validate Beta 2 base
        run: |
          cat lector-beta2.part* > lector-beta2.zip
          echo '8b1d06d9a45bd01439fc299e677951abbff30548913621902cdd1c791773e867  lector-beta2.zip' | sha256sum -c -
          unzip -tq lector-beta2.zip
      - name: Prepare Lextory Beta 4
        run: |
          mkdir -p site
          unzip -q lector-beta2.zip -d site
          cp -a lextory-beta3-overlay/. site/
          cat lextory-beta4-payload/overlay.part* | base64 -d | tar -xz -C site
      - name: Apply Lextory Beta 5 dashboard, icon and multi-source catalogue
        run: |
          cp lextory-beta5/dashboard.css site/dashboard.css
          cp lextory-beta5/dashboard.js site/dashboard.js
          cp lextory-beta5/catalog-universal.js site/catalog-universal.js
          cp lextory-beta5/icon.svg site/icon.svg
          cp lextory-beta5/manifest.webmanifest site/manifest.webmanifest
          cp lextory-beta5/sw.js site/sw.js
          cp lextory-beta6/cloud-sync.js site/cloud-sync.js
          cp lextory-beta6/supabase-config.js site/supabase-config.js
          cp lextory-beta6/premium-ui.js site/premium-ui.js
          cp lextory-beta6/reader-enhancements.js site/reader-enhancements.js
          cp lextory-beta6/bobby-reading.webp site/bobby-reading.webp
          cp lextory-beta6/privacy.html site/privacy.html
          cp lextory-beta6/delete-account.html site/delete-account.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          if 'dashboard.css' not in s:
              s = s.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="dashboard.css">')
          if 'catalog-universal.js' not in s:
              s = s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n  <script src="catalog-universal.js"></script>\n  <script src="dashboard.js"></script>')
          s = s.replace('<span>Project Gutenberg · Google Books</span>', '<span>Project Gutenberg</span>')
          s = s.replace('<span>Project Gutenberg</span>', '<span>Project Gutenberg</span>')
          s = s.replace('Clásicos para descubrir y añadir a tu biblioteca.', 'Busca en Project Gutenberg.')
          s = s.replace('Libros gratuitos</h2>', 'Catálogo de libros</h2>')
          s = s.replace('Clásicos en distintos idiomas con portadas reales, cuando el catálogo las proporciona.', 'Busca por título, autor o categoría en Project Gutenberg. Descarga los EPUB compatibles directamente en Mi Biblioteca.')
          s = s.replace('Libros gratuitos</h2>', 'Explorar libros</h2>')
          s = s.replace('si el navegador bloquea la importación automática, se abre la descarga para que puedas importarla manualmente.', 'los EPUB compatibles se guardan directamente en Mi Biblioteca.')
          s = s.replace('Buscar título o autor…', 'Buscar en Project Gutenberg: título o autor…')
          s = s.replace('Project Gutenberg y encuentra tu próxima lectura.', 'Project Gutenberg y encuentra tu próxima lectura.')
          extras = '''\n  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>\n  <script src="supabase-config.js"></script>\n  <script src="cloud-sync.js"></script>\n  <script src="premium-ui.js"></script>\n  <script src="reader-enhancements.js"></script>'''
          if 'cloud-sync.js' not in s:
              s = s.replace('<script src="dashboard.js"></script>', '<script src="dashboard.js"></script>' + extras)
          p.write_text(s)
          app = Path('site/app.js')
          app_js = app.read_text()
          stamp = "    localStorage.setItem(VOCABULARY_KEY, JSON.stringify(state.vocabulary));"
          if "lector-vocabulary-updated-at" not in app_js:
              if stamp not in app_js:
                  raise SystemExit("Could not locate vocabulary persistence hook")
              app_js = app_js.replace(stamp, stamp + chr(10) + "    localStorage.setItem('lector-vocabulary-updated-at', String(Date.now()));", 1)
          event_hook = "  window.addEventListener('lextory:cloud-vocabulary-restored', () => {" + chr(10) + "    loadVocabulary();" + chr(10) + "    renderVocabulary();" + chr(10) + "  });" + chr(10) + chr(10)
          if "lextory:cloud-vocabulary-restored" not in app_js:
              anchor = "  async function init() {"
              if anchor not in app_js:
                  raise SystemExit("Could not locate application init hook")
              app_js = app_js.replace(anchor, event_hook + anchor, 1)
          location_hook = "    state.epubRendition.on('relocated', location => {" + chr(10) + "      if (!location || !location.start) return;"
          if "state.epubCurrentLocation = location;" not in app_js:
              if location_hook not in app_js:
                  raise SystemExit("Could not locate EPUB location hook")
              app_js = app_js.replace(location_hook, location_hook + chr(10) + "      state.epubCurrentLocation = location;", 1)
          clear_location_anchor = "    state.epubBook = null; state.epubRendition = null; state.pdfDoc = null;"
          if "state.epubCurrentLocation = null;" not in app_js:
              if clear_location_anchor not in app_js:
                  raise SystemExit("Could not locate reader reset hook")
              app_js = app_js.replace(clear_location_anchor, clear_location_anchor + chr(10) + "    state.epubCurrentLocation = null;", 1)
          page_api = r"""  const getCurrentPageTextBase = getCurrentPageText;
            getCurrentPageText = function() {
              if (state.currentBook?.format === 'pdf') return state.pdfPageText || '';
              if (state.epubRendition) {
                try {
                  const location = state.epubCurrentLocation || state.epubRendition.currentLocation();
                  if (location?.start?.cfi && location?.end?.cfi) {
                    const start = state.epubRendition.getRange(location.start.cfi);
                    const end = state.epubRendition.getRange(location.end.cfi);
                    const doc = start?.startContainer?.ownerDocument;
                    if (doc && end?.startContainer?.ownerDocument === doc) {
                      const range = doc.createRange();
                      range.setStart(start.startContainer, start.startOffset);
                      range.setEnd(end.startContainer, end.startOffset);
                      const visibleText = range.toString().replace(/\s+/g, ' ').trim();
                      if (visibleText) return visibleText;
                    }
                  }
                } catch (error) {
                  console.warn('No se pudo extraer la página EPUB visible:', error);
                }
                return '';
              }
              return getCurrentPageTextBase();
            };
            window.LEXTORY_READER = window.LEXTORY_READER || {};
            window.LEXTORY_READER.getCurrentPageText = getCurrentPageText;
          """
          if "window.LEXTORY_READER.getCurrentPageText" not in app_js:
              anchor = "  function safeExternalUrl(value) {"
              if anchor not in app_js:
                  raise SystemExit("Could not locate current-page text API hook")
              app_js = app_js.replace(anchor, page_api + anchor, 1)
          import_start = "  async function importBook(file, metadata = {}) {"
          import_end = "\n  function destroyCurrentReader() {"
          if import_start not in app_js or import_end not in app_js:
              raise SystemExit("Could not locate native book import function")
          if "window.LEXTORY_BOOKS.waitForDatabase" not in app_js:
              start = app_js.index(import_start)
              end = app_js.index(import_end, start)
              new_import = r"""  async function importBook(file, metadata = {}, options = {}) {
              if (!file) return null;
              const ext = String(file.name || '').split('.').pop().toLowerCase();
              if (!['epub', 'pdf'].includes(ext)) { showToast('Elige un archivo EPUB o PDF.'); return null; }
              if (file.size > 180 * 1024 * 1024) { showToast('El archivo supera el límite recomendado de 180 MB.'); return null; }

              try {
                const normalise = value => String(value || '')
                  .replace(/\.(epub|pdf)$/i, '')
                  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                  .toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
                const existingBooks = await getAllBooks();
                const duplicate = existingBooks.find(book => {
                  if (!book.blob || !Number(book.blob.size || 0)) return false;
                  if (metadata.sourceKey && metadata.sourceId != null &&
                      book.sourceKey === metadata.sourceKey &&
                      String(book.sourceId || '') === String(metadata.sourceId)) return true;
                  return metadata.allowTitleMatch !== false &&
                    (normalise(book.title) === normalise(metadata.title || safeBookTitle(file.name)) ||
                     normalise(book.fileName) === normalise(file.name));
                });
                if (duplicate) {
                  await refreshLibrary(true);
                  if (options.openReader === true) openBook(duplicate.id);
                  return duplicate;
                }

                const id = (crypto.randomUUID && crypto.randomUUID()) ||
                  (Date.now() + '-' + Math.random().toString(16).slice(2));
                showToast('Guardando el libro en Mi Biblioteca…');

                // Save the EPUB/PDF before attempting any heavy cover extraction.
                // Use a Blob (rather than depending on File serialization support).
                const storedBlob = file.slice(0, file.size, file.type || (ext === 'epub' ? 'application/epub+zip' : 'application/pdf'));
                const book = {
                  id,
                  title: metadata.title || safeBookTitle(file.name),
                  fileName: file.name,
                  format: ext,
                  blob: storedBlob,
                  coverDataUrl: metadata.coverDataUrl || null,
                  addedAt: Date.now(),
                  updatedAt: Date.now(),
                  progress: 0,
                  lastPage: 1,
                  lastCfi: null,
                  totalPages: null,
                  sourceKey: metadata.sourceKey || null,
                  sourceId: metadata.sourceId == null ? null : String(metadata.sourceId)
                };

                await new Promise((resolve, reject) => {
                  let tx;
                  try {
                    tx = state.db.transaction(STORE, 'readwrite');
                    tx.objectStore(STORE).put(book);
                  } catch (error) {
                    reject(error);
                    return;
                  }
                  tx.oncomplete = () => resolve(true);
                  tx.onerror = () => reject(tx.error || new Error('La base de datos no pudo guardar el libro.'));
                  tx.onabort = () => reject(tx.error || new Error('El guardado del libro se canceló.'));
                });

                // Read-after-write verification: do not tell the user the download is
                // complete until the stored bytes can be read back from IndexedDB.
                const persisted = await getBook(id);
                if (!persisted || !persisted.blob || Number(persisted.blob.size || 0) !== Number(file.size || 0)) {
                  throw new Error('El EPUB se recibió, pero el archivo no quedó guardado correctamente en este dispositivo.');
                }

                await refreshLibrary(true);
                if ($('file-input')) $('file-input').value = '';
                showToast('Libro guardado en Mi Biblioteca.');
                window.dispatchEvent(new CustomEvent('lextory:library-updated', {
                  detail: { bookId: id, title: book.title }
                }));

                // Generate the cover after the book is safely stored. If it fails,
                // the local fallback cover remains clickable and the book is readable.
                if (!book.coverDataUrl) {
                  Promise.resolve().then(async () => {
                    try {
                      const coverDataUrl = await extractBookCover(storedBlob, ext);
                      if (!coverDataUrl) return;
                      const current = await getBook(id);
                      if (!current || current.coverDataUrl) return;
                      current.coverDataUrl = coverDataUrl;
                      current.updatedAt = Date.now();
                      await putBook(current);
                      await refreshLibrary(true);
                    } catch (coverError) {
                      console.info('Libro guardado; no se pudo generar la portada:', coverError);
                    }
                  });
                }

                if (options.openReader !== false) openBook(id);
                return persisted;
              } catch (error) {
                console.error('No se pudo guardar el libro:', error);
                const message = error && error.name === 'QuotaExceededError'
                  ? 'No hay suficiente espacio disponible en este dispositivo para guardar el libro.'
                  : (error && error.message
                    ? 'No se pudo guardar el libro: ' + error.message
                    : 'No se pudo guardar el libro. Comprueba el espacio disponible.');
                showToast(message);
                return null;
              }
            }

            
            async function waitForLibraryDatabase(timeoutMs = 20000) {
              const started = Date.now();
              while (!state.db) {
                if (Date.now() - started >= timeoutMs) {
                  throw new Error('La biblioteca local todavía no está lista. Recarga Lextory e inténtalo de nuevo.');
                }
                await new Promise(resolve => setTimeout(resolve, 50));
              }
              return state.db;
            }

            window.LEXTORY_BOOKS = window.LEXTORY_BOOKS || {};
            window.LEXTORY_BOOKS.waitForDatabase = waitForLibraryDatabase;
            window.LEXTORY_BOOKS.importFile = async (file, metadata = {}, options = {}) => {
              await waitForLibraryDatabase();
              return importBook(file, metadata, options);
            };
            window.LEXTORY_BOOKS.getAll = async () => {
              await waitForLibraryDatabase();
              return getAllBooks();
            };
            window.LEXTORY_BOOKS.refresh = async () => {
              await waitForLibraryDatabase();
              return refreshLibrary();
            };
"""
              app_js = app_js[:start] + new_import + app_js[end:]
          delete_anchor = "        await deleteBookRecord(book.id); await refreshLibrary(); showToast('Libro eliminado de tu biblioteca.');"
          if delete_anchor in app_js and "detail: { deletedBookId: book.id }" not in app_js:
              app_js = app_js.replace(
                  delete_anchor,
                  "        await deleteBookRecord(book.id); await refreshLibrary(); window.dispatchEvent(new CustomEvent('lextory:library-updated', { detail: { deletedBookId: book.id } })); showToast('Libro eliminado de tu biblioteca.');",
                  1
              )
          library_anchor = "    state.books = (await getAllBooks()).sort((a, b) => (b.updatedAt || b.addedAt) - (a.updatedAt || a.addedAt));"
          library_filtered = "    state.books = (await getAllBooks()).filter(book => book && book.blob && Number(book.blob.size || 0) > 0 && ['epub', 'pdf'].includes(String(book.format || '').toLowerCase())).sort((a, b) => (b.updatedAt || b.addedAt) - (a.updatedAt || a.addedAt));"
          if "ONLY_STORED_BOOKS_IN_LIBRARY" not in app_js:
              if library_anchor not in app_js:
                  raise SystemExit("Could not locate library rendering filter hook")
              app_js = app_js.replace(library_anchor, "    // ONLY_STORED_BOOKS_IN_LIBRARY" + chr(10) + library_filtered, 1)

          download_start = "  async function downloadGutenbergBook(book, button) {"
          download_end = "\n  function renderCatalogBooks(books, append = false) {"
          if download_start not in app_js or download_end not in app_js:
              raise SystemExit("Could not locate native Gutenberg download function")
          start = app_js.index(download_start)
          end = app_js.index(download_end, start)
          new_download = r"""  async function downloadGutenbergBook(book, button) {
            if (button.disabled) return;
            const id = Number(book && book.id);
            if (!Number.isSafeInteger(id) || id <= 0) {
              showToast('No se ha podido identificar este libro de Project Gutenberg.');
              return;
            }
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'Descargando en Lextory…';
            try {
              const config = window.LEXTORY_SUPABASE_CONFIG || {};
              if (!config.url || !config.publishableKey) {
                throw new Error('No está disponible el servicio seguro de descarga de Lextory.');
              }
              const endpoint = config.url.replace(/\/+$/, '') + '/functions/v1/gutenberg-epub?id=' + encodeURIComponent(String(id));
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 60000);
              let response;
              try {
                response = await fetch(endpoint, {
                  method: 'GET',
                  mode: 'cors',
                  credentials: 'omit',
                  cache: 'no-store',
                  signal: controller.signal,
                  headers: {
                    apikey: config.publishableKey,
                    Accept: 'application/epub+zip,application/octet-stream;q=0.9'
                  }
                });
              } finally {
                clearTimeout(timeout);
              }
              if (!response.ok) {
                let detail = '';
                try { const payload = await response.json(); detail = payload.error || ''; } catch (_) {}
                throw new Error(detail || ('El servicio de Gutenberg respondió HTTP ' + response.status + '.'));
              }
              const downloadedBlob = await response.blob();
              if (!downloadedBlob.size) throw new Error('Gutenberg ha devuelto un archivo vacío.');
              const signature = new Uint8Array(await downloadedBlob.slice(0, 4).arrayBuffer());
              if (signature[0] !== 0x50 || signature[1] !== 0x4b) {
                throw new Error('La respuesta no contiene un EPUB válido.');
              }

              const safeTitle = (book.title || ('Libro ' + id)).replace(/[\\\\/:*?"<>|]+/g, '-').trim();
              const file = new File([downloadedBlob], (safeTitle || ('Libro ' + id)) + '.epub', {
                type: 'application/epub+zip',
                lastModified: Date.now()
              });
              button.textContent = 'Guardando portada y libro…';
              const saved = await importBook(file, {
                title: book.title,
                sourceKey: 'gutenberg',
                sourceId: String(id)
              }, { openReader: false });
              if (!saved || !saved.blob || !Number(saved.blob.size || 0)) {
                throw new Error('Lextory no ha confirmado que el libro se haya guardado.');
              }

              button.textContent = '✓ En Mi Biblioteca';
              button.classList.add('is-downloaded');
              button.closest('.catalog-card')?.remove();
              showToast('«' + (book.title || 'El libro') + '» ya está guardado en Mi Biblioteca. Ábrelo desde su portada.');
            } catch (error) {
              console.error('No se pudo guardar el libro de Gutenberg en Lextory:', error);
              button.disabled = false;
              button.textContent = originalText;
              showToast(error && error.message ? error.message : 'No se pudo guardar el EPUB en Lextory.');
            }
          }

          """
          app_js = app_js[:start] + new_download + app_js[end:]

          native_action_start = "    button.textContent = hasEpub ? 'Descargar al lector ↓' : 'Ver ficha oficial ↗';"
          native_action_end = "    actions.append(button, sourceLink);"
          if native_action_start in app_js and native_action_end in app_js:
              start = app_js.index(native_action_start)
              end = app_js.index(native_action_end, start) + len(native_action_end)
              native_action = """    if (hasEpub) {
              button.textContent = 'Descargar en Mi Biblioteca ↓';
              button.addEventListener('click', event => {
                event.preventDefault(); event.stopPropagation();
                downloadGutenbergBook(book, button);
              });
            } else {
              button.textContent = 'EPUB no disponible';
              button.disabled = true;
            }
            actions.appendChild(button);"""
              app_js = app_js[:start] + native_action + app_js[end:]

          cover_anchor = "      const cover = document.createElement('div');"
          cover_behavior = """      const cover = document.createElement('div');
                cover.setAttribute('role', 'button');
                cover.setAttribute('tabindex', '0');
                cover.setAttribute('aria-label', 'Abrir ' + (book.title || 'libro'));
                cover.title = 'Abrir libro';
                cover.style.cursor = 'pointer';
                const openFromCover = () => openBook(book.id);
                cover.addEventListener('click', openFromCover);
                cover.addEventListener('keydown', event => {
                  if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openFromCover();
                  }
                });"""
          if "PORTADA_ABRE_LECTOR" not in app_js:
              if cover_anchor not in app_js:
                  raise SystemExit("Could not locate library cover interaction hook")
              app_js = app_js.replace(cover_anchor, cover_behavior.replace("      const cover = document.createElement('div');", "      const cover = document.createElement('div'); // PORTADA_ABRE_LECTOR"), 1)
          app.write_text(app_js)
          PY
          python - <<'PY'
          from pathlib import Path

          required = [
              ("site/dashboard.js", "bobby-reading.webp"),
              ("site/sw.js", "bobby-reading.webp"),
              ("site/index.html", "dashboard.css"),
              ("site/index.html", "dashboard.js"),
              ("site/index.html", "catalog-universal.js"),
              ("site/index.html", "cloud-sync.js"),
              ("site/cloud-sync.js", "privacy.html"),
              ("site/cloud-sync.js", "delete-account.html"),
              ("site/app.js", "lector-vocabulary-updated-at"),
              ("site/app.js", "window.LEXTORY_READER.getCurrentPageText"),
              ("site/app.js", "window.LEXTORY_BOOKS.importFile"),
              ("site/sw.js", "lextory-shell-v29"),
              ("site/index.html", "unpkg.com/@supabase/supabase-js@2"),
              ("site/catalog-universal.js", "Project Gutenberg"),
              ("site/catalog-universal.js", "catalog-import-external"),
              ("site/catalog-universal.js", "functions/v1/gutenberg-epub"),
              ("site/app.js", "Save the EPUB/PDF before attempting any heavy cover extraction."),
              ("site/dashboard.css", "body:not(.dark) .app-sidebar"),
          ]
          image_asset = Path("site/bobby-reading.webp")
          if not image_asset.is_file() or image_asset.stat().st_size == 0:
              raise SystemExit("Build validation failed: missing or empty site/bobby-reading.webp")
          print("OK site/bobby-reading.webp exists")

          for file_name, marker in required:
              path = Path(file_name)
              if not path.exists():
                  raise SystemExit(f"Build validation failed: missing {file_name}")
              if marker not in path.read_text(errors="replace"):
                  raise SystemExit(f"Build validation failed: marker {marker!r} not found in {file_name}")
              print(f"OK {file_name}: {marker}")

          catalogue = Path("site/catalog-universal.js").read_text(errors="replace").lower()
          forbidden = ("openlibrary", "open library", "google books", "googleapis.com/books", "importgoogle")
          found = [term for term in forbidden if term in catalogue]
          if found:
              raise SystemExit("Build validation failed: removed catalogue source returned: " + ", ".join(found))
          print("OK removed catalogue sources")
          PY
          for source in site/app.js site/catalog-universal.js site/dashboard.js site/cloud-sync.js site/supabase-config.js site/premium-ui.js site/reader-enhancements.js site/sw.js; do
            node --check "$source" || { echo "JavaScript syntax validation failed: $source"; exit 1; }
          done
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
